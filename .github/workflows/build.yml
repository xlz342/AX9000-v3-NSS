name: AX9000-v3 NSS Edition (experimental)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'config/**'
      - 'files/**'
      - 'inputs/**'
      - 'vendor/**'
      - 'sources.lock.json'
permissions:
  contents: read
concurrency:
  group: ax9000-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim runner disk and monitor capacity
        run: |
          mkdir -p logs artifacts
          df -h > logs/disk-before-cleanup.txt
          # Only remove unrelated preinstalled SDKs on this disposable Linux runner.
          sudo du -xhd1 /opt /usr/local /usr/share 2>/dev/null | sort -h > logs/preinstalled-disk-usage.txt
          # Actions use their own bundled Node runtime, not hostedtoolcache.
          # Build dependencies below come from apt; no setup-* action uses these SDKs.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /opt/az /usr/share/swift /usr/local/share/powershell /usr/local/share/boost
          if command -v docker >/dev/null; then
            sudo docker system prune --all --force >/dev/null
          fi
          sudo apt-get clean
          df -h | tee logs/disk-after-cleanup.txt
          available_kb=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')
          if (( available_kb < 45 * 1024 * 1024 )); then
            echo "::error::Less than 45 GiB free for the OpenWrt toolchain, kernel and Go build."
            exit 1
          fi
          nohup bash -c 'while true; do date -u; df -h "$GITHUB_WORKSPACE"; free -h; sleep 60; done' > logs/resources.log 2>&1 < /dev/null &
          echo "$!" > logs/resources.pid
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-yaml rsync swig unzip zlib1g-dev file wget curl zstd libelf-dev libpython3-dev python3-setuptools
          mkdir -p logs artifacts
          df -h > logs/disk-before.txt
      - name: Checkout official release, import NSS and QCN9074 BDF, configure
        run: |
          set -o pipefail
          bash scripts/setup.sh "$GITHUB_WORKSPACE/build" 2>&1 | tee logs/setup.log
      - name: Prepare kernel (reject incompatible patches)
        working-directory: build
        run: |
          set -o pipefail
          make -j2 tools/install V=s 2>&1 | tee ../logs/tools.log
          make target/linux/prepare V=s 2>&1 | tee ../logs/kernel-prepare.log
      - name: Download sources
        working-directory: build
        run: |
          set -o pipefail
          make download -j8 V=s 2>&1 | tee ../logs/download.log
      - name: Compile
        working-directory: build
        run: |
          set -o pipefail
          make -j2 V=s 2>&1 | tee ../logs/build.log || make -j1 V=s 2>&1 | tee ../logs/build-retry.log
      - name: Validate metadata, archive, package manifest and sizes
        run: python3 scripts/validate-image.py build artifacts
      - name: Save diagnostics
        if: always()
        run: |
          if test -f logs/resources.pid; then kill "$(cat logs/resources.pid)" 2>/dev/null || true; fi
          df -h > logs/disk-final.txt
          free -h > logs/memory-final.txt
          for f in .config config.seed feeds.conf.default sources.lock.json protected-source.json source-changes.patch; do
            if test -f "build/$f"; then cp "build/$f" "logs/${f#.}"; fi
          done
          if test -d build/logs; then cp -r build/logs logs/openwrt; fi
      - name: Upload validated firmware
        uses: actions/upload-artifact@v4
        with:
          name: AX9000-v3-NSS-experimental-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Upload configuration and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AX9000-v3-diagnostics-${{ github.run_number }}
          path: logs/
          if-no-files-found: warn
          retention-days: 14
