name: AX9000-v4 NSS WiFi Nikki (experimental)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'config/**'
      - 'files/**'
      - 'inputs/**'
      - 'vendor/**'
      - 'sources.lock.json'
permissions:
  contents: read
concurrency:
  group: ax9000-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Reject private backups and unexpected inputs
        run: python3 scripts/check-source-inputs.py
      - name: Reclaim runner disk and monitor capacity
        run: |
          mkdir -p logs artifacts
          df -h > logs/disk-before-cleanup.txt
          # Only remove unrelated preinstalled SDKs on this disposable Linux runner.
          sudo du -xhd1 /opt /usr/local /usr/share 2>/dev/null | sort -h > logs/preinstalled-disk-usage.txt
          # Actions use their own bundled Node runtime, not hostedtoolcache.
          # Build dependencies below come from apt; no setup-* action uses these SDKs.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /opt/az /usr/share/swift /usr/local/share/powershell /usr/local/share/boost
          if command -v docker >/dev/null; then
            sudo docker system prune --all --force >/dev/null
          fi
          sudo apt-get clean
          df -h | tee logs/disk-after-cleanup.txt
          available_kb=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')
          if (( available_kb < 45 * 1024 * 1024 )); then
            echo "::error::Less than 45 GiB free for the OpenWrt toolchain, kernel and Go build."
            exit 1
          fi
          nohup bash -c 'while true; do date -u; df -h "$GITHUB_WORKSPACE"; free -h; sleep 60; done' > logs/resources.log 2>&1 < /dev/null &
          echo "$!" > logs/resources.pid
      - name: Build dependencies
        timeout-minutes: 20
        run: |
          set -o pipefail
          # Avoid the runner's mirror+file Azure mirror selection, which stalled
          # run 9 for the entire six-hour job budget. Keep signature verification.
          cat > /tmp/ax9000-ubuntu.list <<'EOF'
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main restricted universe multiverse
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main restricted universe multiverse
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu noble-security main restricted universe multiverse
          EOF
          apt_opts=(-o Dir::Etc::sourcelist=/tmp/ax9000-ubuntu.list -o Dir::Etc::sourceparts=- -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::ForceIPv4=true)
          sudo timeout --kill-after=15s 5m apt-get "${apt_opts[@]}" -o APT::Update::Error-Mode=any update 2>&1 | tee logs/apt-update.log
          sudo timeout --kill-after=15s 14m apt-get "${apt_opts[@]}" install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-yaml squashfs-tools rsync swig unzip zlib1g-dev file wget curl zstd libelf-dev libpython3-dev python3-setuptools 2>&1 | tee logs/apt-install.log
          mkdir -p logs artifacts
          df -h > logs/disk-before.txt
      - name: Checkout official release, import NSS and QCN9074 BDF, configure
        run: |
          set -o pipefail
          python3 scripts/test-v4.py
          python3 scripts/test-image-extraction.py
          bash scripts/setup.sh "$GITHUB_WORKSPACE/build" 2>&1 | tee logs/setup.log
      - name: Prepare kernel (reject incompatible patches)
        working-directory: build
        run: |
          set -o pipefail
          make -j2 tools/install V=s 2>&1 | tee ../logs/tools.log
          test -x staging_dir/host/bin/unsquashfs4 || { echo '::error::tools/install did not produce unsquashfs4'; exit 1; }
          make target/linux/prepare V=s 2>&1 | tee ../logs/kernel-prepare.log
      - name: Download sources
        working-directory: build
        run: |
          set -o pipefail
          make download -j8 V=s 2>&1 | tee ../logs/download.log
          make package/firmware/ipq-wifi/prepare V=s 2>&1 | tee ../logs/ipq-wifi-prepare.log
          python3 - <<'PY'
          from pathlib import Path
          source = Path('package/firmware/ipq-wifi/src/board-xiaomi_ax9000.qcn9074')
          prepared = list(Path('build_dir').glob('target-*/ipq-wifi-*/board-xiaomi_ax9000.qcn9074'))
          assert len(prepared) == 1, prepared
          assert prepared[0].read_bytes() == source.read_bytes(), 'Custom QCN9074 BDF not imported during package prepare'
          print('Custom QCN9074 BDF package prepare verified')
          PY
      - name: Prepare mac80211 and reject NSS WiFi patch conflicts
        working-directory: build
        run: |
          set -o pipefail
          make package/kernel/mac80211/prepare V=s 2>&1 | tee ../logs/wifi-prepare.log
      - name: Compile
        id: compile
        working-directory: build
        run: |
          set -o pipefail
          make -j2 V=s 2>&1 | tee ../logs/build.log || make -j1 V=s 2>&1 | tee ../logs/build-retry.log
      - name: Validate metadata, archive, package manifest and sizes
        id: validate
        run: |
          # fwtool is built by package/system/fwtool/host during the full build.
          test -x build/staging_dir/host/bin/fwtool || { echo '::error::Full build did not produce host fwtool'; exit 1; }
          python3 scripts/validate-image.py build artifacts
      - name: Preserve stock images if acceptance fails (diagnostics only)
        if: failure() && steps.compile.outcome == 'success' && steps.validate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: AX9000-v4-UNVALIDATED-diagnostic-images-${{ github.run_number }}
          path: |
            build/bin/targets/qualcommax/ipq807x/*-xiaomi_ax9000-stock-squashfs-sysupgrade.bin
            build/bin/targets/qualcommax/ipq807x/*-xiaomi_ax9000-stock-squashfs-factory.ubi
            build/bin/targets/qualcommax/ipq807x/*-xiaomi_ax9000-stock.manifest
            build/bin/targets/qualcommax/ipq807x/profiles.json
          if-no-files-found: error
          retention-days: 7
      - name: Save diagnostics
        if: always()
        run: |
          if test -f logs/resources.pid; then kill "$(cat logs/resources.pid)" 2>/dev/null || true; fi
          df -h > logs/disk-final.txt
          free -h > logs/memory-final.txt
          for f in .config config.seed feeds.conf.default sources.lock.json protected-source.json source-changes.patch; do
            if test -f "build/$f"; then cp "build/$f" "logs/${f#.}"; fi
          done
          if test -d build/logs; then cp -r build/logs logs/openwrt; fi
      - name: Upload validated firmware
        uses: actions/upload-artifact@v4
        with:
          name: AX9000-v4-NSS-WiFi-Nikki-experimental-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Upload configuration and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AX9000-v4-diagnostics-${{ github.run_number }}
          path: logs/
          if-no-files-found: warn
          retention-days: 14
