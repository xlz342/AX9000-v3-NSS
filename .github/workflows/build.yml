name: AX9000-v3 NSS Edition (experimental)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'config/**'
      - 'files/**'
      - 'inputs/**'
      - 'vendor/**'
      - 'sources.lock.json'
permissions:
  contents: read
concurrency:
  group: ax9000-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-yaml rsync swig unzip zlib1g-dev file wget curl zstd libelf-dev libpython3-dev python3-setuptools
          mkdir -p logs artifacts
          df -h > logs/disk-before.txt
      - name: Checkout official release, import NSS and QCN9074 BDF, configure
        run: |
          set -o pipefail
          bash scripts/setup.sh "$GITHUB_WORKSPACE/build" 2>&1 | tee logs/setup.log
      - name: Prepare kernel (reject incompatible patches)
        working-directory: build
        run: |
          set -o pipefail
          make -j2 tools/install V=s 2>&1 | tee ../logs/tools.log
          make target/linux/prepare V=s 2>&1 | tee ../logs/kernel-prepare.log
      - name: Download sources
        working-directory: build
        run: |
          set -o pipefail
          make download -j8 V=s 2>&1 | tee ../logs/download.log
      - name: Compile
        working-directory: build
        run: |
          set -o pipefail
          make -j2 V=s 2>&1 | tee ../logs/build.log || make -j1 V=s 2>&1 | tee ../logs/build-retry.log
      - name: Validate metadata, archive, package manifest and sizes
        run: python3 scripts/validate-image.py build artifacts
      - name: Save diagnostics
        if: always()
        run: |
          for f in .config config.seed feeds.conf.default sources.lock.json protected-source.json source-changes.patch; do
            if test -f "build/$f"; then cp "build/$f" "logs/${f#.}"; fi
          done
          if test -d build/logs; then cp -r build/logs logs/openwrt; fi
      - name: Upload validated firmware
        uses: actions/upload-artifact@v4
        with:
          name: AX9000-v3-NSS-experimental-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Upload configuration and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AX9000-v3-diagnostics-${{ github.run_number }}
          path: logs/
          if-no-files-found: warn
          retention-days: 14
